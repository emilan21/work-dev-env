[env]
TERM = "xterm-256color"

[terminal]
osc52 = "OnlyCopy"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 12

[window]
padding = { x = 14, y = 14 }
decorations = "Full"
opacity = 1.0
option_as_alt = "OnlyLeft"

[scrolling]
history = 10000

[colors.primary]
background = "#202124"
foreground = "#b0aea8"

[colors.normal]
black = "#303238"
red = "#b58080"
green = "#92a18b"
yellow = "#b1a27e"
blue = "#879cac"
magenta = "#a394a8"
cyan = "#87a6a1"
white = "#b0aea8"

[colors.bright]
black = "#66686e"
red = "#b58080"
green = "#92a18b"
yellow = "#b1a27e"
blue = "#879cac"
magenta = "#a394a8"
cyan = "#87a6a1"
white = "#b0aea8"

[[keyboard.bindings]]
key = "C"
mods = "Command"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Command"
action = "Paste"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B[13;2u"
