set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'
set -g history-limit 10000
set -s escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g status-interval 15
set -g status-style 'bg=#303238,fg=#b0aea8'
set -g status-right '%H:%M'
set -g set-clipboard on
setw -g mode-keys vi
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind v split-window -h -c '#{pane_current_path}'
bind s split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind x confirm-before -p 'Kill pane #P? (y/n)' kill-pane
bind k confirm-before -p 'Kill window #W? (y/n)' kill-window
bind C-k confirm-before -p 'Kill session #S? (y/n)' kill-session
bind f new-window '"$HOME/.local/bin/ts"'
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'Config reloaded'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel pbcopy

# Bootstrap creates these directories with mode 0700 before installing plugins.
set -g @resurrect-dir '~/.local/state/work-dev-env/resurrect'
set -g @resurrect-default-processes 'nvim'
set -g @resurrect-processes 'nvim'
set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-delete-backup-after '7'
set -g @resurrect-hook-post-restore-all 'tmux set-option -g @work-restore-done 1'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @continuum-boot 'off'
if-shell 'test -x "$HOME/.local/share/work-dev-env/tmux-resurrect/resurrect.tmux"' 'run-shell "\"$HOME/.local/share/work-dev-env/tmux-resurrect/resurrect.tmux\""'
# Continuum must be loaded last; it adds its save hook to status-right.
if-shell 'test -x "$HOME/.local/share/work-dev-env/tmux-continuum/continuum.tmux"' 'run-shell "\"$HOME/.local/share/work-dev-env/tmux-continuum/continuum.tmux\""'
source-file -q ~/.config/tmux/local.conf
